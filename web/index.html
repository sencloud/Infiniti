<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" />
    <title>无限连接 · 关系式学习助手</title>
    <meta name="description" content="无限连接是一款创新阅读与学习服务软件：AI 通读名著、史书与教材，把人物和知识点连成可交互的关系图谱，每条关系都能回到原文，帮你读懂一本书、理清一门课、准备一次考试。" />
    <meta property="og:title" content="无限连接 · 关系式学习助手" />
    <meta property="og:description" content="AI 通读学习材料，把人物与知识点连成关系图谱，每条关系都能回到原文。" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        var t = localStorage.getItem('infiniti-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var path = location.pathname;
        var onEn = path === '/en' || path.indexOf('/en/') === 0;
        var stored = localStorage.getItem('infiniti-locale');
        var bareHome = path === '/' || path === '';
        var enHome = path === '/en' || path === '/en/';
        if (bareHome && (stored === 'en' || (!stored && /^en/i.test(navigator.language || '')))) {
          location.replace('/en' + location.search + location.hash);
          return;
        }
        if (enHome && stored === 'zh-CN') {
          location.replace('/' + location.search + location.hash);
          return;
        }
        document.documentElement.lang = onEn ? 'en' : 'zh-CN';
        if (onEn) document.title = 'Infiniti · A relational study guide';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
