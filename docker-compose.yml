# Neo4j 图数据库
# 网页管理界面: http://localhost:7474  (neo4j / infiniti123)
services:
  neo4j:
    image: neo4j:5-community
    container_name: infiniti-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP 管理界面 (Browser)
      - "7687:7687"   # Bolt 协议 (应用连接)
    environment:
      NEO4J_AUTH: neo4j/infiniti123
      # 限制内存占用，本地开发足够
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  neo4j-data:
  neo4j-logs:
